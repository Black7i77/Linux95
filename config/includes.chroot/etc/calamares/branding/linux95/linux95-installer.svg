  <circle cx="42" cy="40" r="4" fill="#ff5f57"/>
  <circle cx="56" cy="40" r="4" fill="#ffbd2e"/>
  <circle cx="70" cy="40" r="4" fill="#28c840"/>

  <!-- Main installer panel -->
  <rect x="42" y="72" width="172" height="88" fill="#ffffff" stroke="#000" stroke-width="3"/>
  <rect x="54" y="86" width="88" height="12" fill="#000080"/>
  <rect x="54" y="108" width="116" height="8" fill="#808080"/>
  <rect x="54" y="122" width="104" height="8" fill="#808080"/>
  <rect x="54" y="136" width="92" height="8" fill="#808080"/>

